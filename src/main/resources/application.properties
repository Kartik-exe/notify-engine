spring.application.name=notify-engine

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# MariaDB Configuration
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/notifications?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional for Spring Boot 3+
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ==========================================
# Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# ==========================================
# Kafka Producer
# ==========================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ==========================================
# Kafka Consumer
# ==========================================
spring.kafka.consumer.group-id=notification-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.notify_engine.model.NotificationRequest

# ==========================================
# Gmail SMTP Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_gmail_app_password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# Logging
# ==========================================
logging.level.com.notify_engine=DEBUG
logging.level.org.springframework.kafka=INFO

# ==========================================
# Eureka
# ==========================================
eureka.client.enabled=false